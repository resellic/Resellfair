name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Prepare project
        run: |
          if [ ! -f settings.gradle.kts ]; then
            Z=$(find . -maxdepth 2 -name "*.zip" | head -1)
            echo "Unzipping: $Z"
            mkdir -p proj && unzip -o "$Z" -d proj
            echo "PROJ=proj" >> $GITHUB_ENV
          else
            echo "PROJ=." >> $GITHUB_ENV
          fi
          ls -la "$(grep PROJ $GITHUB_ENV | cut -d= -f2)"
      - name: Build
        run: gradle -p "$PROJ" --no-daemon assembleRelease
      - run: cp "$PROJ/app/build/outputs/apk/release/app-release.apk" ResellfairAdmin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ResellfairAdmin
          path: ResellfairAdmin.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ResellfairAdmin.apk
