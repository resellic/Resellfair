name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Find project
        run: |
          F=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -1)
          echo "Found: $F"
          echo "PROJ=$(dirname "$F")" >> $GITHUB_ENV
      - name: Build
        run: gradle -p "$PROJ" --no-daemon assembleRelease
      - run: cp "$PROJ/app/build/outputs/apk/release/app-release.apk" ResellfairAdmin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ResellfairAdmin
          path: ResellfairAdmin.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ResellfairAdmin.apk
