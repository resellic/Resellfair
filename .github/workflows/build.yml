name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Find project
        run: |
          if [ -f settings.gradle.kts ]; then PROJ=.
          else
            ZIP=$(ls *.zip 2>/dev/null | head -n 1)
            [ -n "$ZIP" ] || { echo "No settings.gradle.kts and no zip in the repo"; exit 1; }
            mkdir proj && unzip -q "$ZIP" -d proj
            PROJ=$(dirname "$(find proj -name settings.gradle.kts | head -n 1)")
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
      - run: gradle -p "$PROJ" --no-daemon assembleRelease
      - run: cp "$PROJ/app/build/outputs/apk/release/app-release.apk" ResellfairAdmin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ResellfairAdmin
          path: ResellfairAdmin.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ResellfairAdmin.apk
